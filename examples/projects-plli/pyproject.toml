[project]
name = "projects-plli"
version = "0.1.0"
description = "Asterum glyph OCR and deterministic Korean composition practice project"
authors = [
    { name = "Haneul Cho", email = "stuykr@naver.com" },
]
license = "MIT"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
asterum-api = "asterum.api.main:run"
asterum-asset-audit = "asterum.data.asset_audit:main"
asterum-import-characters = "asterum.data.import_characters:main"
asterum-prepare-images = "asterum.data.prepare_images:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv.build-backend]
module-name = "asterum"
module-root = "backend/src"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "frontend/node_modules",
    "frontend/dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "ARG", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["backend/src", "backend/tests"]

[[tool.mypy.overrides]]
module = ["pillow_heif"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["asterum"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
